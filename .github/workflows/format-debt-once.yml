name: Temporary ktlint debt screen formatter
on:
  push:
    branches: [feat/client-debts]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - working-directory: android-app
        run: gradle --no-daemon :app:ktlintFormat
      - name: Commit style corrections
        run: |
          if ! git diff --quiet -- android-app; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android-app
            git commit -m "style(android): format debt module"
            git push origin HEAD:feat/client-debts
          fi
