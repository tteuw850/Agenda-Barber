name: One-off Android ktlint formatting (integration only)
on:
  push:
    branches:
      - feat/integrate-recurring-calendar
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/integrate-recurring-calendar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Format Kotlin
        working-directory: android-app
        run: gradle --no-daemon :app:ktlintFormat
      - name: Commit formatting changes to feature branch only
        run: |
          if ! git diff --quiet -- android-app; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android-app
            git commit -m "style(android): apply ktlint formatting to integrated UI"
            git push origin HEAD:feat/integrate-recurring-calendar
          fi
