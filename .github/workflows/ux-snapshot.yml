name: UX-01 screenshot (emulator, no backend)

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/ux-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture logged-out login screen
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/f02-15-ux-review'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install compile SDK on hosted runner only
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Enable KVM for the hosted emulator
        run: |
          sudo sh -c 'echo KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APK and capture login on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android-app
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.agendabarber.app/.MainActivity
            sleep 8
            mkdir -p ../ux-screenshots
            adb exec-out screencap -p > ../ux-screenshots/UX-01_login_emulator.png
            test -s ../ux-screenshots/UX-01_login_emulator.png
      - name: Publish screenshot for manual visual comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f02-15-ux01-emulator-screenshot
          path: ux-screenshots/UX-01_login_emulator.png
          if-no-files-found: error
          retention-days: 7
