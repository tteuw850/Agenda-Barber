name: CI - Agenda Barber
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Java - Maven verify and Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Java tests and Checkstyle
        run: mvn -B -ntp -f backend/pom.xml verify

  android:
    name: Android - ktlint, tests, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Provision Android SDK on CI runner
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Kotlin style, tests, Android Lint and APK
        run: gradle --no-daemon :app:ktlintCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
