name: CD - AWS EC2 DEV via OIDC + S3 + SSM (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_AWS_DEV to deploy only to the development EC2
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: agenda-barber-aws-development
  cancel-in-progress: false

jobs:
  authorize:
    name: Require main branch and explicit approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate target and confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tteuw850/Agenda-Barber"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "DEPLOY_AWS_DEV"

  deploy:
    name: Build on runner; deliver through private S3 and SSM
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: development
    env:
      AWS_BASE_URL: ${{ vars.AWS_DEV_BASE_URL }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_DEV_RELEASE_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: us-east-2
      EC2_ID: i-02063104b98a730db
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Validate exclusive AWS development destination
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_ROLE_ARN" = "arn:aws:iam::916949393497:role/AgendaBarber-GitHub-SSM-DEV-Role"
          [[ "$AWS_RELEASE_BUCKET" =~ ^agenda-barber-dev-releases-916949393497(-[a-z0-9-]+)?$ ]]
          test "$AWS_BASE_URL" = "https://18-216-115-216.sslip.io"

      - name: Verify Java tests and Checkstyle
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: Build versioned Docker image on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          image="agenda-barber-dev:aws-$short"
          docker build --file backend/Dockerfile --tag "$image" backend
          docker save "$image" | gzip -1 > "$RUNNER_TEMP/agenda-barber-image.tar.gz"
          sha256sum "$RUNNER_TEMP/agenda-barber-image.tar.gz" | cut -d ' ' -f 1 > "$RUNNER_TEMP/image-sha256"

      - name: Assume temporary AWS deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: AgendaBarberDevDeploy
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Upload versioned artifacts to private S3
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          prefix="s3://$AWS_RELEASE_BUCKET/releases/$short"
          aws s3 cp "$RUNNER_TEMP/agenda-barber-image.tar.gz" "$prefix/agenda-barber-image.tar.gz" --sse AES256 --only-show-errors
          aws s3 cp scripts/deploy/aws-ec2-release.sh "$prefix/aws-ec2-release.sh" --sse AES256 --only-show-errors
          aws s3 cp scripts/deploy/aws-ec2-release-ssm.sh "$prefix/aws-ec2-release-ssm.sh" --sse AES256 --only-show-errors
          echo "Artifacts uploaded to private S3 release prefix for $short."

      - name: Run native SSM remote script on the single development EC2
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          digest="$(cat "$RUNNER_TEMP/image-sha256")"
          export short digest
          python3 - <<'PY'
          import json, os
          bucket = os.environ["AWS_RELEASE_BUCKET"]
          short = os.environ["short"]
          digest = os.environ["digest"]
          source = {"path": f"https://{bucket}.s3.us-east-2.amazonaws.com/releases/{short}/"}
          params = {
              "sourceType": ["S3"],
              "sourceInfo": [json.dumps(source, separators=(",", ":"))],
              "commandLine": [f"bash aws-ec2-release-ssm.sh {short} {digest}"],
              "executionTimeout": ["1800"]
          }
          with open(os.environ["RUNNER_TEMP"] + "/ssm-parameters.json", "w") as f:
              json.dump(params, f)
          PY
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_ID" \
            --document-name AWS-RunRemoteScript \
            --comment "Agenda Barber AWS DEV release $short" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --timeout-seconds 1800 --max-concurrency 1 --max-errors 0 \
            --query Command.CommandId --output text)"
          echo "SSM command ID: $command_id"
          success=0
          for attempt in $(seq 1 150); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$EC2_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success)
                success=1; break;;
              Pending|InProgress|Delayed|Cancelling)
                sleep 10;;
              *)
                echo "::error::SSM deployment failed. Command $command_id; status=$status."
                exit 1;;
            esac
          done
          if test "$success" != 1; then
            echo "::error::SSM deployment timed out. Check command $command_id in Systems Manager."
            exit 1
          fi
          echo "SSM deployment completed successfully: $command_id"

      - name: Validate public HTTPS and protected endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="${AWS_BASE_URL%/}"
          response="$(curl -fsS --connect-timeout 10 --max-time 30 "$base/actuator/health")"
          printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
          unauth="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$base/api/v1/clients")"
          test "$unauth" = 401
          echo "AWS DEV HTTP 200 UP; protected API 401 without credentials."
