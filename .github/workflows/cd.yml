name: CD - AWS EC2 DEV via OIDC and private SSM tunnel (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_AWS_DEV to release exclusively on development EC2
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: agenda-barber-aws-development
  cancel-in-progress: false

jobs:
  authorize:
    name: Require main branch and explicit confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployment authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tteuw850/Agenda-Barber"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "DEPLOY_AWS_DEV"

  deploy:
    name: Build off-host; deliver directly to EC2 over SSM tunnel
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: development
    env:
      AWS_REGION: us-east-2
      EC2_ID: i-02063104b98a730db
      AWS_BASE_URL: ${{ vars.AWS_DEV_BASE_URL }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check AWS development destination
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_ROLE_ARN" = 'arn:aws:iam::916949393497:role/AgendaBarber-GitHub-SSM-DEV-Role'
          test "$AWS_BASE_URL" = 'https://18-216-115-216.sslip.io'

      - name: Verify backend tests and Checkstyle
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: Build versioned Docker image on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          image="agenda-barber-dev:aws-$short"
          docker build --file backend/Dockerfile --tag "$image" backend
          docker save "$image" | gzip -1 > "$RUNNER_TEMP/agenda-barber-image.tar.gz"
          test -s "$RUNNER_TEMP/agenda-barber-image.tar.gz"

      - name: Obtain temporary AWS permissions via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: AgendaBarberDevDeploy
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Install official AWS Session Manager plugin
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb' \
            --output "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg --install "$RUNNER_TEMP/session-manager-plugin.deb"
          session-manager-plugin --version

      - name: Configure existing dedicated SSH key and pinned EC2 host key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AWS_DEV_SSH_PRIVATE_KEY }}
          PINNED_HOSTS: ${{ secrets.AWS_DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_KEY" || -z "$PINNED_HOSTS" ]]; then
            echo '::error::Existing dedicated SSH secrets are missing in development environment.'
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/aws_deploy"
          chmod 600 "$HOME/.ssh/aws_deploy"
          printf '%s\n' "$PINNED_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F '18.216.115.216' -f "$HOME/.ssh/known_hosts" > /dev/null
          # The tunnel uses local port 2222. Derive its host-key pin ONLY from
          # the already-verified EC2 host key, never from an untrusted scan.
          ssh-keygen -F '18.216.115.216' -f "$HOME/.ssh/known_hosts" |
            awk '!/^#/ && NF >= 3 && ($2 ~ /^ssh-/ || $2 ~ /^ecdsa-/) {
              print "[127.0.0.1]:2222", $2, $3
            }' > "$HOME/.ssh/ssm_known_hosts"
          chmod 600 "$HOME/.ssh/ssm_known_hosts"
          ssh-keygen -F '[127.0.0.1]:2222' -f "$HOME/.ssh/ssm_known_hosts" > /dev/null

      - name: Open temporary SSM tunnel to EC2 local SSH port
        shell: bash
        run: |
          set -euo pipefail
          aws ssm start-session \
            --target "$EC2_ID" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["22"],"localPortNumber":["2222"]}' \
            > "$RUNNER_TEMP/ssm-tunnel.log" 2>&1 &
          tunnel_pid=$!
          echo "SSM_TUNNEL_PID=$tunnel_pid" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo '::error::SSM tunnel exited before opening port.'
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo '::error::SSM tunnel not ready.'; exit 1; }
          echo 'SSM tunnel listening on loopback; EC2 inbound SSH does not need to be public.'

      - name: Transfer image and rollback script directly to EC2 through tunnel
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/ssm_known_hosts"
                    -o IdentitiesOnly=yes
                    -o ConnectTimeout=20 -i "$HOME/.ssh/aws_deploy")
          scp -P 2222 "${ssh_opts[@]}" "$RUNNER_TEMP/agenda-barber-image.tar.gz" \
            "ubuntu@127.0.0.1:/tmp/agenda-barber-$short.tar.gz"
          scp -P 2222 "${ssh_opts[@]}" scripts/deploy/aws-ec2-release.sh \
            "ubuntu@127.0.0.1:/tmp/agenda-barber-release-$short.sh"

      - name: Deploy with existing health-checked rollback
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          ssh -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/ssm_known_hosts" \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i "$HOME/.ssh/aws_deploy" \
            ubuntu@127.0.0.1 "bash /tmp/agenda-barber-release-$short.sh $short"

      - name: Confirm AWS HTTPS health and protected route
        shell: bash
        run: |
          set -euo pipefail
          base="${AWS_BASE_URL%/}"
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "$base/actuator/health")"
          printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
          unauth="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            --max-time 20 "$base/api/v1/clients")"
          test "$unauth" = 401
          echo 'EC2 release healthy through public TLS; protected API returns 401.'

      - name: Tear down SSM tunnel and remove temporary private key
        if: always()
        shell: bash
        run: |
          if [[ -n "${SSM_TUNNEL_PID:-}" ]]; then
            kill "$SSM_TUNNEL_PID" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/aws_deploy" "$HOME/.ssh/ssm_known_hosts"
